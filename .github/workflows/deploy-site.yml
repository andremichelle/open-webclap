# The site (site/) on GitHub Pages, at webclap.opendaw.studio. The plugins themselves are not built here: the
# pages load the bundles openDAW hosts.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
# pages/id-token move to the deploy job: on forks the push-event token cannot be granted them at workflow
# scope, which fails the whole run before any job starts; job-scoped they apply where they are needed

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      # a fork's Pages serves under /<repo>/; upstream serves at the domain root (custom domain)
      SITE_BASE: "${{ github.repository == 'andremichelle/open-webclap' && '/' || format('/{0}/', github.event.repository.name) }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
