<!DOCTYPE html>
<!--
    Elements' editor page (the bundle's ui/index.html), adapted from upstream's web/ page (same MIT project):
    the preset library (upstream's 24 web presets, ui/patches.json), one tab per group of the module's panel,
    a playable keyboard, and an Atlas tab with upstream's sound atlas (ui/atlas.json, generated by upstream's
    `make web-atlas`: 2,024 sounds laid out by their measured descriptors, see ports/faust-elements/SESSION.md).
    It no longer runs its own WASM: it talks to module.wasm over ArrayBuffers (window.parent.postMessage), binary
    little endian, the types at the top of elements_clap.cpp:

    page -> plugin:   1 hello, 2 poll, 3 begin (u32 id@4), 4 set (u32 id@4, f64 value@8), 5 end (u32 id@4),
                      6 hover (u32 id@4, 0xffffffff none), 8 patch (u16 name length@2, name@4, 21 x f64 values),
                      9 defaults, 10 panic, 11 note on (u32 key@4, f64 velocity@8), 12 note off (u32 key@4)
    plugin -> page:   0x81 describe (the parameter table JSON from 4), 0x82 snapshot (21 x f32 from 4),
                      0x83 values (u16 count@2, then count x (u32 id, u32 0, f64 value)),
                      0x84 activity (u8 active voices@1, f32 output peak@4)

    The page says hello, gets the table and a snapshot, then polls at most every 33 ms. A drag is one gesture
    (begin, values, end); the hovered parameter is reported so the host's menu and value entry work. openDAW owns
    double-click, right-click and the wheel on the host side: no handlers for them here, no preventDefault on
    presses. Notes from the host's keyboard also play; the on-screen keyboard sends its own note messages.
-->
<html>
<head>
<meta charset="utf-8">
<title>Elements</title>
<style>
    :root {
        --bg: #131110; --panel: #1c1815; --panel2: #242019; --line: #322b24; --ink: #e8ddd0; --dim: #97897a;
        --accent: #e8c98a; --led: #ffd257; --display: #14100c; --display-text: #ffdf9e;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; color: var(--ink);
           font-family: "Segoe UI", Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
    #stage { position: relative; width: 1024px; height: 640px; background: var(--bg); flex: none;
             display: flex; transform-origin: center center; overflow: hidden; }
    /* library */
    #library { width: 232px; flex: none; border-right: 1px solid var(--line); padding: 14px; box-sizing: border-box;
               display: flex; flex-direction: column; }
    #library h1 { font-size: 15px; margin: 4px 0 10px; color: var(--accent); letter-spacing: .5px; }
    .section-label { font-size: 9px; letter-spacing: 1.5px; color: var(--dim); display: flex;
                     justify-content: space-between; margin-bottom: 8px; }
    .preset-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .preset-card { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--panel);
                   border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 5px 9px;
                   cursor: pointer; font: inherit; }
    .preset-card:hover { border-color: var(--accent); }
    .preset-card.active { background: var(--panel2); border-color: var(--accent); }
    .preset-card .preset-index { font-size: 9px; color: var(--dim); }
    .preset-card strong { display: block; font-size: 11px; color: var(--accent); }
    .preset-card small { display: block; font-size: 8px; letter-spacing: .5px; color: var(--dim);
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    #library .foot { margin-top: auto; font-size: 9px; color: var(--dim); line-height: 1.5; }
    /* main column */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #patch-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 16px 8px; }
    .eyebrow { font-size: 9px; letter-spacing: 1.5px; color: var(--dim); }
    #modified { color: var(--led); border: 1px solid var(--led); border-radius: 3px; padding: 0 4px;
                font-size: 8px; margin-left: 6px; vertical-align: 1px; }
    #patch-name { margin: 2px 0; font-size: 20px; color: var(--accent); }
    #patch-tag { font-size: 9px; letter-spacing: 1px; color: var(--dim); }
    #patch-description { margin: 4px 0 0; font-size: 10px; color: var(--dim); max-width: 460px; }
    #patch-actions { display: flex; gap: 8px; align-items: center; }
    button { font: inherit; cursor: pointer; }
    .ghost { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 5px;
             padding: 6px 10px; font-size: 11px; }
    .ghost:hover { border-color: var(--accent); color: var(--accent); }
    /* meter */
    #meter-row { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; font-size: 9px;
                 letter-spacing: 1.5px; color: var(--dim); }
    #meter { width: 160px; height: 8px; background: var(--display); border: 1px solid var(--line);
             border-radius: 3px; overflow: hidden; }
    #meter-fill { display: block; height: 100%; width: 0%; background: var(--led); }
    #voices-stat { color: var(--ink); }
    /* tabs */
    #tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim);
           padding: 6px 10px; font-size: 11px; letter-spacing: .5px; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* control panel */
    #control-panel { flex: 1; overflow-y: auto; padding: 12px 16px; position: relative; }
    .panel-header h3 { margin: 0; font-size: 12px; letter-spacing: 2px; color: var(--accent); }
    .panel-header p { margin: 2px 0 10px; font-size: 9px; color: var(--dim); }
    .control-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .control { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
    .control-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .control label { font-size: 10px; color: var(--ink); white-space: nowrap; overflow: hidden;
                     text-overflow: ellipsis; }
    .control output { font-size: 9px; color: var(--display-text); font-family: ui-monospace, monospace;
                      white-space: nowrap; }
    .control input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
    .control select { width: 100%; margin-top: 6px; background: var(--display); color: var(--display-text);
                      border: 1px solid var(--line); border-radius: 4px; font-size: 10px; padding: 3px; }
    .control .tip { font-size: 8px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
    /* atlas */
    #atlas-wrap { position: absolute; inset: 0; }
    #atlas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    #atlas-tip { position: absolute; pointer-events: none; background: var(--display); border: 1px solid var(--line);
                 border-radius: 4px; padding: 6px 8px; font-size: 9px; color: var(--display-text);
                 font-family: ui-monospace, monospace; display: none; white-space: pre; z-index: 5; }
    #atlas-legend { position: absolute; top: 8px; right: 10px; font-size: 9px; color: var(--dim);
                    background: rgba(20,16,12,.8); padding: 4px 8px; border-radius: 4px; line-height: 1.7; }
    #atlas-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    /* keyboard */
    #keyboard { flex: none; height: 96px; border-top: 1px solid var(--line); display: flex; align-items: flex-end;
                justify-content: center; padding: 8px 0 10px; gap: 0; position: relative; }
    .key { position: relative; border: 1px solid var(--line); cursor: pointer; }
    .key.white { width: 40px; height: 76px; background: var(--panel); border-radius: 0 0 4px 4px; z-index: 1; }
    .key.black { width: 26px; height: 46px; background: var(--display); border-radius: 0 0 3px 3px; z-index: 2;
                 margin: 0 -13px; }
    .key.down { background: var(--accent); }
    .key span { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 8px;
                color: var(--dim); pointer-events: none; }
    #feedback { padding: 6px 16px; font-size: 10px; color: var(--dim); border-top: 1px solid var(--line); }
    #feedback.error { color: #ff6b6b; }
</style>
</head>
<body>
<div id="stage">
  <aside id="library">
    <div class="section-label"><span>SOUND LIBRARY</span><span id="preset-count">24</span></div>
    <h1>Elements</h1>
    <div id="preset-list" class="preset-list" aria-label="Presets"></div>
    <div class="foot">Mutable Instruments Elements, modelled in Faust<br><small>Sound is synthesized live in module.wasm (32 kHz).</small></div>
  </aside>
  <div id="main">
    <section id="patch-header">
      <div>
        <div class="eyebrow">CURRENT PATCH <span id="modified" hidden>MODIFIED</span></div>
        <h2 id="patch-name">—</h2>
        <div id="patch-tag"></div>
        <p id="patch-description"></p>
      </div>
      <div id="patch-actions">
        <button id="reset-patch" class="ghost" title="Restore the selected preset">↺ Reset</button>
        <button id="panic" class="ghost" title="Stop all notes">Stop all</button>
      </div>
    </section>
    <div id="meter-row">
      <span>OUTPUT</span>
      <div id="meter"><span id="meter-fill"></span></div>
      <span>VOICES <b id="voices-stat">0 / 8</b></span>
      <span id="engine-status">connecting…</span>
    </div>
    <nav id="tabs" class="tabs" aria-label="Panel sections"></nav>
    <section id="control-panel" aria-live="polite"></section>
    <div id="keyboard" title="Click or drag across the keys"></div>
    <p id="feedback" role="status">Loading the parameter table…</p>
  </div>
</div>
<script>
"use strict";
// --- protocol ----------------------------------------------------------------------------------------
const PAGE = {HELLO: 1, POLL: 2, BEGIN: 3, SET: 4, END: 5, HOVER: 6, PATCH: 8, DEFAULTS: 9, PANIC: 10, NOTE_ON: 11, NOTE_OFF: 12};
const PLUGIN = {DESCRIBE: 0x81, SNAPSHOT: 0x82, VALUES: 0x83, ACTIVITY: 0x84};
const post = bytes => window.parent.postMessage(bytes, "*");
function msg(type, size, fill) {
    const buffer = new ArrayBuffer(size);
    const view = new DataView(buffer);
    view.setUint8(0, type);
    if (fill) {fill(view);}
    post(buffer);
}
const sendSet = (id, value) => msg(PAGE.SET, 16, v => {v.setUint32(4, id, true); v.setFloat64(8, value, true);});
const sendGesture = (type, id) => msg(type, 8, v => v.setUint32(4, id, true));
const sendHover = id => msg(PAGE.HOVER, 8, v => v.setUint32(4, id, true));
const sendNoteOn = (key, velocity) => msg(PAGE.NOTE_ON, 16, v => {v.setUint32(4, key, true); v.setFloat64(8, velocity, true);});
const sendNoteOff = key => msg(PAGE.NOTE_OFF, 8, v => v.setUint32(4, key, true));
const sendPatch = (name, values) => {
    const bytes = new TextEncoder().encode(name);
    msg(PAGE.PATCH, 4 + bytes.length + values.length * 8, v => {
        v.setUint16(2, bytes.length, true);
        new Uint8Array(v.buffer).set(bytes, 4);
        for (let i = 0; i < values.length; i++) {v.setFloat64(4 + bytes.length + 8 * i, values[i], true);}
    });
};

// --- state -------------------------------------------------------------------------------------------
let params = [];                 // per id, from the describe message
let values = [];                 // per id, the current value
let patches = {};                // id -> {title, tag, description, values: {key: value}}
let selected = null;
let views = new Map();           // id -> [{input, output}]
let dragging = -1;
const $ = id => document.getElementById(id);
const leaf = key => key.split("/").at(-1);
// Labels from upstream's web/controls.js (English), so the panel reads like the module's documentation.
const names = {envelope: "Contour", bow: "Bow", blow: "Blow", strike: "Strike", bow_timbre: "Bow timbre",
    flow: "Flow", blow_timbre: "Blow timbre", mallet: "Mallet", strike_timbre: "Strike timbre",
    geometry: "Geometry", brightness: "Brightness", damping: "Damping", position: "Position", model: "Model",
    space: "Space", signature: "Signature", mod_frequency: "LFO rate", mod_offset: "LFO offset",
    diffusion: "Diffusion", reverb_lp: "Reverb tone", modulation: "Pitch offset"};
const tabs = [["exciter", "Exciter"], ["resonator", "Resonator"], ["space", "Space"], ["unit", "Unit"],
              ["performance", "Performance"], ["atlas", "Atlas"]];
const tabHints = {
    exciter: "The bow, the blow and the strike, and their envelopes and timbres.",
    resonator: "52 modes, or one string, or a chord of five strings.",
    space: "Stereo spread, then the reverb; frozen above 1.75.",
    unit: "The module's own small differences, the pickup LFO, and the reverb's colour.",
    performance: "The FM input, in semitones, added to every note.",
    atlas: "2,024 sounds laid out by what they sound like (their measured descriptors, projected on their two first principal components). Click a dot to load it and hear it; drag to move, wheel to zoom, double-click to fit.",
};

function pretty(p, v) {
    if (p.menu) {
        let best = p.menu[0];
        for (const m of p.menu) {if (Math.abs(m[1] - v) < Math.abs(best[1] - v)) {best = m;}}
        return best[0];
    }
    if (leaf(p.key) === "modulation") {return (v >= 0 ? "+" : "") + v.toFixed(2) + " st";}
    if (p.unit) {return Number(v).toFixed(2) + " " + p.unit;}
    return Number(v).toFixed(3);
}
function setValue(id, value, send = true) {
    const p = params[id];
    if (!p || !Number.isFinite(Number(value))) {return;}
    value = Math.min(p.max, Math.max(p.min, Number(value)));
    values[id] = value;
    for (const view of views.get(id) || []) {
        view.input.value = value;
        view.output.textContent = pretty(p, value);
        view.input.setAttribute("aria-valuetext", pretty(p, value));
    }
    if (send) {sendSet(id, value);}
    updateModified();
}
function updateModified() {
    if (!patches[selected]) {return;}
    const base = patches[selected].values;
    const changed = params.some((p, id) => Math.abs(values[id] - (base[p.key] ?? p.init)) > 1e-6);
    $("modified").hidden = !changed;
}
function applyPreset(id) {
    if (!patches[id]) {return;}
    selected = id;
    const base = patches[id].values;
    const all = params.map(p => Math.min(p.max, Math.max(p.min, base[p.key] ?? p.init)));
    for (let i = 0; i < params.length; i++) {setValue(i, all[i], false);}
    sendPatch(id, all);
    document.querySelectorAll(".preset-card").forEach(el => {
        const on = el.dataset.preset === id;
        el.classList.toggle("active", on);
        el.setAttribute("aria-pressed", String(on));
    });
    $("patch-name").textContent = patches[id].title;
    $("patch-tag").textContent = patches[id].tag;
    $("patch-description").textContent = patches[id].description;
    $("modified").hidden = true;
}

// --- controls ----------------------------------------------------------------------------------------
function makeControl(p) {
    const box = document.createElement("div");
    box.className = "control";
    const top = document.createElement("div");
    top.className = "control-top";
    const label = document.createElement("label");
    const id = "ctrl-" + p.id;
    label.htmlFor = id;
    label.textContent = names[leaf(p.key)] || leaf(p.key).replaceAll("_", " ");
    const output = document.createElement("output");
    top.append(label, output);
    box.append(top);
    if (p.menu) {
        const sel = document.createElement("select");
        sel.setAttribute("aria-label", label.textContent);
        for (const [name, value] of p.menu) {
            const op = document.createElement("option");
            op.value = value;
            op.textContent = name;
            sel.append(op);
        }
        sel.value = values[p.id];
        sel.setAttribute("aria-valuetext", pretty(p, values[p.id]));
        sel.addEventListener("change", () => {
            sendGesture(PAGE.BEGIN, p.id);
            setValue(p.id, Number(sel.value));
            sendGesture(PAGE.END, p.id);
        });
        box.append(sel);
        views.set(p.id, [{input: sel, output}]);
    } else {
        const input = document.createElement("input");
        input.id = id;
        input.type = "range";
        input.min = p.min;
        input.max = p.max;
        input.step = p.step || 0.001;
        input.value = values[p.id];
        input.setAttribute("aria-label", label.textContent);
        input.addEventListener("pointerdown", () => {dragging = p.id; sendGesture(PAGE.BEGIN, p.id);});
        input.addEventListener("input", () => setValue(p.id, Number(input.value)));
        const release = () => {if (dragging === p.id) {dragging = -1; sendGesture(PAGE.END, p.id);}};
        input.addEventListener("pointerup", release);
        input.addEventListener("pointercancel", release);
        input.setAttribute("aria-valuetext", pretty(p, values[p.id]));
        box.append(input);
        views.set(p.id, [{input, output}]);
    }
    if (p.tooltip) {
        const tip = document.createElement("div");
        tip.className = "tip";
        tip.textContent = p.tooltip;
        box.append(tip);
    }
    output.textContent = pretty(p, values[p.id]);
    wireHover(box, p.id);
    return box;
}
function wireHover(el, id) {
    el.addEventListener("pointerenter", () => sendHover(id));
    el.addEventListener("pointerleave", () => sendHover(0xffffffff));
}
function showTab(id) {
    views = new Map();
    document.querySelectorAll(".tab").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === id);
        b.setAttribute("aria-selected", String(b.dataset.tab === id));
    });
    const panel = $("control-panel");
    panel.replaceChildren();
    if (id === "atlas") {buildAtlas(panel); return;}
    const header = document.createElement("div");
    header.className = "panel-header";
    const title = document.createElement("h3");
    title.textContent = tabs.find(t => t[0] === id)[1].toUpperCase();
    const hint = document.createElement("p");
    hint.textContent = tabHints[id] || "";
    header.append(title, hint);
    panel.append(header);
    const grid = document.createElement("div");
    grid.className = "control-grid";
    for (const p of params.filter(p => p.group === id)) {grid.append(makeControl(p));}
    panel.append(grid);
}

// --- atlas -------------------------------------------------------------------------------------------
// Upstream's sound atlas (web/atlas.json): every point is a patch, played offline as A3 for a second and measured
// (brightness, noisiness, harmonicity, attack, sustain, decay, loudness, width), then placed at its two first
// principal components of the standardized descriptors (loudness excepted). Click loads the patch and plays it.
let atlas = null, atlasView = {scale: 1, x: 0, y: 0}, atlasCanvas = null, atlasCtx = null, atlasHover = -1;
const MODEL_COLORS = ["#e8c98a", "#7ac9e8", "#c98ae8"];
const MODEL_NAMES = ["modal", "string", "strings"];
function atlasModelOf(point) {return Math.round(point.v[atlas.controls.indexOf("resonator/model")] ?? 0);}
async function buildAtlas(panel) {
    const wrap = document.createElement("div");
    wrap.id = "atlas-wrap";
    atlasCanvas = document.createElement("canvas");
    atlasCanvas.id = "atlas";
    const tip = document.createElement("div");
    tip.id = "atlas-tip";
    const legend = document.createElement("div");
    legend.id = "atlas-legend";
    legend.innerHTML = MODEL_NAMES.map((name, i) => `<div><i style="background:${MODEL_COLORS[i]}"></i>${name}</div>`).join("") +
                       `<div style="margin-top:4px">${atlas ? atlas.points.length : "…"} sounds · wheel zoom · drag pan · dbl-click fit</div>`;
    wrap.append(atlasCanvas, tip, legend);
    panel.append(wrap);
    if (!atlas) {atlas = await (await fetch("atlas.json")).json(); legend.lastChild.textContent =
        `${atlas.points.length} sounds · wheel zoom · drag pan · dbl-click fit`;}
    const fit = () => {
        const rect = atlasCanvas.getBoundingClientRect();
        atlasCanvas.width = Math.max(2, rect.width * devicePixelRatio);
        atlasCanvas.height = Math.max(2, rect.height * devicePixelRatio);
        let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
        for (const p of atlas.points) {x0 = Math.min(x0, p.pc[0]); x1 = Math.max(x1, p.pc[0]);
                                      y0 = Math.min(y0, p.pc[1]); y1 = Math.max(y1, p.pc[1]);}
        const pad = 30 * devicePixelRatio;
        atlasView.scale = Math.min((atlasCanvas.width - 2 * pad) / Math.max(1e-9, x1 - x0),
                                   (atlasCanvas.height - 2 * pad) / Math.max(1e-9, y1 - y0));
        atlasView.x = pad - x0 * atlasView.scale + (atlasCanvas.width - 2 * pad - (x1 - x0) * atlasView.scale) / 2;
        atlasView.y = pad - y0 * atlasView.scale + (atlasCanvas.height - 2 * pad - (y1 - y0) * atlasView.scale) / 2;
        drawAtlas();
    };
    fit();
    let draggingView = null;
    atlasCanvas.addEventListener("pointerdown", e => {draggingView = {x: e.offsetX, y: e.offsetY, moved: false};});
    atlasCanvas.addEventListener("pointermove", e => {
        const mx = e.offsetX * devicePixelRatio, my = e.offsetY * devicePixelRatio; // offsetX/Y are relative to the canvas
        if (draggingView) {
            if (Math.abs(e.offsetX - draggingView.x) + Math.abs(e.offsetY - draggingView.y) > 4) {draggingView.moved = true;}
            if (draggingView.moved) {
                atlasView.x += (e.offsetX - draggingView.x) * devicePixelRatio;
                atlasView.y += (e.offsetY - draggingView.y) * devicePixelRatio;
                draggingView.x = e.offsetX; draggingView.y = e.offsetY;
                drawAtlas();
                return;
            }
        }
        // hover: nearest point within 8 px
        let best = -1, bestD = 64;
        for (let i = 0; i < atlas.points.length; i++) {
            const p = atlas.points[i];
            const sx = atlasView.x + p.pc[0] * atlasView.scale, sy = atlasView.y + p.pc[1] * atlasView.scale;
            const d = (sx - mx) ** 2 + (sy - my) ** 2;
            if (d < bestD) {bestD = d; best = i;}
        }
        atlasHover = best;
        if (best >= 0) {
            const p = atlas.points[best];
            const names8 = atlas.axes;
            tip.style.display = "block";
            tip.style.left = (e.offsetX + 14) + "px";
            tip.style.top = (e.offsetY + 10) + "px";
            tip.textContent = (p.preset ? p.preset + "\n" : "") + names8.map((a, i) => `${a}: ${formatDescriptor(a, p.d[i])}`).join("\n");
        } else {tip.style.display = "none";}
        drawAtlas();
    });
    atlasCanvas.addEventListener("pointerup", e => {
        const wasDrag = draggingView && draggingView.moved;
        draggingView = null;
        if (wasDrag || atlasHover < 0) {return;}
        loadAtlasPoint(atlasHover);
    });
    atlasCanvas.addEventListener("pointerleave", () => {tip.style.display = "none"; atlasHover = -1; drawAtlas();});
    atlasCanvas.addEventListener("wheel", e => {
        e.preventDefault();
        const mx = e.offsetX * devicePixelRatio, my = e.offsetY * devicePixelRatio;
        const factor = Math.exp(-e.deltaY * 0.0015);
        const scale = Math.min(1e6, Math.max(1e-4, atlasView.scale * factor));
        atlasView.x = mx - (mx - atlasView.x) * (scale / atlasView.scale);
        atlasView.y = my - (my - atlasView.y) * (scale / atlasView.scale);
        atlasView.scale = scale;
        drawAtlas();
    }, {passive: false});
    atlasCanvas.addEventListener("dblclick", fit);
}
function formatDescriptor(axis, v) {
    if (axis === "brightness") {return v.toFixed(0) + " Hz";}
    if (axis === "attack" || axis === "decay") {return v.toFixed(3) + " s";}
    if (axis === "harmonicity") {return v.toFixed(2);}
    return v.toFixed(1) + " dB";
}
function drawAtlas() {
    if (!atlasCanvas) {return;}
    const ctx = atlasCtx ??= atlasCanvas.getContext("2d");
    ctx.fillStyle = "#14100c";
    ctx.fillRect(0, 0, atlasCanvas.width, atlasCanvas.height);
    for (let i = 0; i < atlas.points.length; i++) {
        const p = atlas.points[i];
        const x = atlasView.x + p.pc[0] * atlasView.scale, y = atlasView.y + p.pc[1] * atlasView.scale;
        if (x < -5 || y < -5 || x > atlasCanvas.width + 5 || y > atlasCanvas.height + 5) {continue;}
        const preset = !!p.preset;
        ctx.fillStyle = MODEL_COLORS[atlasModelOf(p)];
        ctx.globalAlpha = preset ? 1 : 0.75;
        ctx.beginPath();
        ctx.arc(x, y, (preset ? 4 : 2.4) * (i === atlasHover ? 2 : 1), 0, 7);
        ctx.fill();
        if (preset) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#e8ddd0";
            ctx.font = `${10 * devicePixelRatio}px Verdana`;
            ctx.fillText(p.preset, x + 6 * devicePixelRatio, y - 4 * devicePixelRatio);
        }
    }
    ctx.globalAlpha = 1;
}
function loadAtlasPoint(i) {
    const p = atlas.points[i];
    const byShort = Object.fromEntries(params.map(q => [q.key.replace("/elements_poly/", ""), q]));
    const all = params.map(q => {
        const short = q.key.replace("/elements_poly/", "");
        const at = atlas.controls.indexOf(short);
        return at >= 0 ? p.v[at] : q.init;
    });
    const id = p.preset ?? ("atlas #" + i);
    sendPatch(id, all);
    for (let k = 0; k < params.length; k++) {
        values[k] = Math.min(params[k].max, Math.max(params[k].min, all[k]));
    }
    if (patches[p.preset]) {applyPreset(p.preset);} else {
        selected = null;
        document.querySelectorAll(".preset-card").forEach(el => el.classList.remove("active"));
        $("patch-name").textContent = id;
        $("patch-tag").textContent = "sound atlas";
        $("patch-description").textContent = "A patch from the atlas, laid out by its measured descriptors.";
    }
    refreshViews();
    sendNoteOn(atlas.note.key, atlas.note.velocity);
    setTimeout(() => sendNoteOff(atlas.note.key), atlas.note.hold * 1000);
}

// --- keyboard ----------------------------------------------------------------------------------------
const KEY_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
function buildKeyboard() {
    const kb = $("keyboard");
    const first = 48, last = 72; // C3..C5
    const down = new Set();
    let gliss = false;
    for (let key = first; key <= last; key++) {
        const el = document.createElement("div");
        const black = KEY_NAMES[key % 12].includes("#");
        el.className = "key " + (black ? "black" : "white");
        el.dataset.key = key;
        el.innerHTML = `<span>${KEY_NAMES[key % 12]}${Math.floor(key / 12) - 1}</span>`;
        el.addEventListener("pointerdown", e => {
            e.preventDefault();
            gliss = true;
            if (!down.has(key)) {down.add(key); el.classList.add("down"); sendNoteOn(key, 0.8);}
        });
        el.addEventListener("pointerenter", () => {
            if (gliss && !down.has(key)) {down.add(key); el.classList.add("down"); sendNoteOn(key, 0.8);}
        });
        el.addEventListener("pointerup", () => release(key));
        el.addEventListener("pointerleave", () => {if (gliss) {release(key);}});
        kb.append(el);
    }
    function release(key) {
        if (down.has(key)) {
            down.delete(key);
            const el = kb.querySelector(`[data-key="${key}"]`);
            if (el) {el.classList.remove("down");}
            sendNoteOff(key);
        }
    }
    addEventListener("pointerup", () => {gliss = false;});
}

// --- plugin messages ---------------------------------------------------------------------------------
window.addEventListener("message", event => {
    const data = new Uint8Array(event.data);
    if (data.length < 1) {return;}
    const view = new DataView(event.data);
    if (data[0] === PLUGIN.DESCRIBE) {
        params = JSON.parse(new TextDecoder().decode(data.slice(4)));
        values = params.map(p => p.init);
        buildPage();
    } else if (data[0] === PLUGIN.SNAPSHOT) {
        for (let i = 0; i < params.length && 4 + 4 * i + 4 <= data.length; i++) {
            values[i] = view.getFloat32(4 + 4 * i, true);
        }
        refreshViews();
        updateModified();
        snapshotArrived = true;
        startUp();
    } else if (data[0] === PLUGIN.VALUES) {
        const count = view.getUint16(2, true);
        for (let i = 0; i < count; i++) {
            const at = 4 + 16 * i;
            const id = view.getUint32(at, true);
            const value = view.getFloat64(at + 8, true);
            if (id < params.length && values[id] !== value) {
                values[id] = value;
                for (const v of views.get(id) || []) {
                    v.input.value = value;
                    v.output.textContent = pretty(params[id], value);
                }
            }
        }
        updateModified();
    } else if (data[0] === PLUGIN.ACTIVITY) {
        $("voices-stat").textContent = `${data[1]} / 8`;
        const peak = view.getFloat32(4, true);
        const db = peak > 0 ? Math.max(-60, 20 * Math.log10(peak)) : -60;
        $("meter-fill").style.width = `${Math.max(0, (db + 60) / 60 * 100)}%`;
    }
});
function refreshViews() {
    for (let id = 0; id < params.length; id++) {
        for (const v of views.get(id) || []) {
            v.input.value = values[id];
            v.output.textContent = pretty(params[id], values[id]);
        }
    }
}

// --- page --------------------------------------------------------------------------------------------
let ready = false, snapshotArrived = false, built = false;
function startUp() {
    if (ready || !built || !snapshotArrived) {return;}
    ready = true;
    applyPreset("default");
    showTab("exciter");
    $("engine-status").textContent = "connected";
    $("feedback").textContent = "Play from the host keyboard, a MIDI keyboard, or the keys below. The Atlas tab lays out 2,024 measured sounds.";
    setInterval(() => msg(PAGE.POLL, 4), 33);
}
async function buildPage() {
    patches = await (await fetch("patches.json")).json();
    $("preset-count").textContent = String(Object.keys(patches).length).padStart(2, "0");
    for (const [index, id] of Object.keys(patches).entries()) {
        const b = document.createElement("button");
        b.className = "preset-card";
        b.dataset.preset = id;
        b.setAttribute("aria-pressed", "false");
        b.title = patches[id].tag;
        b.innerHTML = `<span class="preset-index">${String(index + 1).padStart(2, "0")}</span>` +
                      `<span><strong>${patches[id].title}</strong><small>${patches[id].tag}</small></span>`;
        b.onclick = () => applyPreset(id);
        $("preset-list").append(b);
    }
    for (const [id, label] of tabs) {
        const b = document.createElement("button");
        b.className = "tab";
        b.dataset.tab = id;
        b.textContent = label;
        b.setAttribute("role", "tab");
        b.onclick = () => showTab(id);
        $("tabs").append(b);
    }
    buildKeyboard();
    built = true;
    startUp();
}
$("panic").onclick = () => msg(PAGE.PANIC, 4);
$("reset-patch").onclick = () => {if (selected) {applyPreset(selected);}};
function fit() {
    const scale = Math.min(innerWidth / 1024, innerHeight / 640);
    $("stage").style.transform = `scale(${scale})`;
}
addEventListener("resize", fit);
fit();
msg(PAGE.HELLO, 4);
</script>
